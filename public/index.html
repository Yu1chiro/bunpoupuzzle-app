<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%229%22%20fill%3D%22%23dcefff%22%2F%3E%3Cpath%20d%3D%22M7%207h7a3%203%200%201%201%206%200h5v7a3%203%200%201%200%200%206v5h-7a3%203%200%201%200-6%200H7v-7a3%203%200%201%200%200-6Z%22%20fill%3D%22%230369a1%22%2F%3E%3C%2Fsvg%3E"
    />
    <meta name="theme-color" content="#eef8ff" />
    <meta
      name="description"
      content="Susun potongan kalimat Jepang, kumpulkan EXP, dan latih bunpou setiap hari."
    />
    <title>Pilih deck · Bunpou Puzzle</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Nunito, "Noto Sans JP", sans-serif;
      }
      button,
      a,
      input,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button:not(:disabled),
      summary {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 3px solid #0284c7;
        outline-offset: 4px;
      }
      .jp {
        font-family: "Noto Sans JP", sans-serif;
        overflow-wrap: anywhere;
      }
      .tile {
        touch-action: none;
        user-select: none;
      }
      .sortable-ghost {
        opacity: 0.3;
        background: #bae6fd;
      }
      .sortable-chosen {
        border-color: #0284c7;
      }
      .sortable-drag {
        box-shadow: 0 10px 30px #07598525;
      }
      .pop {
        animation: pop 0.2s ease-out;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-[#eef8ff] text-slate-700 antialiased selection:bg-sky-200"
  >
    <header class="border-b border-sky-100 bg-white/80">
      <div
        class="mx-auto flex max-w-5xl items-center justify-between px-5 py-4"
      >
        <a href="/" class="flex items-center gap-3 font-black text-slate-800"
          ><span
            class="grid h-10 w-10 place-items-center rounded-2xl bg-sky-200 text-lg text-sky-800"
            ><i class="fa-solid fa-puzzle-piece" aria-hidden="true"></i></span
          ><span
            >Bunpou<span class="ml-1 font-semibold text-sky-700"
              >Puzzle</span
            ></span
          ></a
        ><span
          class="rounded-full bg-sky-50 px-3 py-1 text-sm font-bold text-sky-800"
          >ぶんぽう</span
        >
      </div>
    </header>
    <main id="main" class="mx-auto max-w-5xl px-4 pb-32 pt-6 sm:px-6">
      <section
        class="relative overflow-hidden rounded-[2rem] border border-sky-200 bg-[#dcefff] p-6 sm:p-8"
      >
        <div class="flex items-start justify-between gap-4">
          <div>
            <p
              class="text-sm font-extrabold uppercase tracking-widest text-sky-800"
            >
              Sedikit demi sedikit
            </p>
            <h1
              class="mt-2 text-3xl font-black leading-tight text-slate-800 sm:text-4xl"
            >
              Susun kata.<br />Temukan maknanya.
            </h1>
            <p class="mt-3 max-w-md leading-relaxed text-slate-600">
              Pilih deck, susun kalimat Jepang, dan kumpulkan EXP dari setiap
              jawaban benar.
            </p>
          </div>
          <span
            class="mt-2 hidden rotate-12 rounded-3xl bg-white/70 p-5 text-4xl text-sky-600 sm:block"
            ><i class="fa-solid fa-puzzle-piece" aria-hidden="true"></i
          ></span>
        </div>
      </section>
      <div id="overview" class="my-5 grid grid-cols-3 gap-3"></div>
      <div class="mb-4 mt-7 flex items-center justify-between">
        <h2 class="text-xl font-black text-slate-800">Mau latihan apa?</h2>
        <span id="deck-count" class="text-sm font-bold text-slate-500"></span>
      </div>
      <div id="decks" class="grid gap-4 sm:grid-cols-2">
        <p class="py-6 text-slate-500" role="status">Memuat deck…</p>
      </div>
    </main>
    <nav
      aria-label="Navigasi utama"
      class="fixed inset-x-0 bottom-0 z-30 border-t border-sky-100 bg-white/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"
    >
      <div class="mx-auto grid max-w-lg grid-cols-2 gap-2 px-4 py-2">
        <a
          href="/"
          aria-current="page"
          class="flex min-h-14 flex-col items-center justify-center gap-1 rounded-2xl text-sm font-bold bg-sky-100 text-sky-800"
          ><i class="fa-solid fa-layer-group text-lg" aria-hidden="true"></i
          >Deck</a
        ><a
          href="/profile"
          class="flex min-h-14 flex-col items-center justify-center gap-1 rounded-2xl text-sm font-bold text-slate-500 hover:bg-sky-50"
          ><i class="fa-solid fa-chart-simple text-lg" aria-hidden="true"></i
          >Profil</a
        >
      </div>
    </nav>
    <div
      id="toast"
      role="status"
      aria-live="polite"
      class="fixed inset-x-4 top-4 z-[70] mx-auto hidden max-w-md rounded-2xl border border-sky-200 bg-white px-5 py-4 shadow-lg"
    ></div>
    <div
      id="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/30 p-4 backdrop-blur-sm"
    >
      <div
        id="modal-panel"
        class="max-h-[85dvh] w-full max-w-lg overflow-y-auto rounded-3xl bg-white p-6 shadow-xl"
      >
        <h2 id="modal-title" class="text-xl font-extrabold text-slate-800"></h2>
        <div id="modal-content" class="mt-4"></div>
        <div id="modal-actions" class="mt-6 flex justify-end gap-3"></div>
      </div>
    </div>
    <script>
      "use strict";
      const PATH = Object.freeze({
        home: "/",
        signin: "/signin",
        admin: "/admin",
        game: "/game-mode",
        profile: "/profile",
        api: "/api",
      });
      const $ = (selector) => document.querySelector(selector);
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const PRIMARY =
        "inline-flex min-h-11 items-center justify-center gap-2 rounded-2xl bg-sky-700 px-5 py-3 font-bold text-white transition hover:bg-sky-800 disabled:opacity-50";
      const SECONDARY =
        "inline-flex min-h-11 items-center justify-center gap-2 rounded-2xl border border-sky-200 bg-white px-4 py-2 font-bold text-sky-800 hover:bg-sky-50";
      const INPUT =
        "mt-2 w-full rounded-2xl border border-sky-200 bg-sky-50/50 px-4 py-3 text-base outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100";
      let toastTimer;
      function toast(message) {
        clearTimeout(toastTimer);
        $("#toast").textContent = message;
        $("#toast").classList.remove("hidden");
        toastTimer = setTimeout(
          () => $("#toast").classList.add("hidden"),
          6000,
        );
      }
      async function api(url, options = {}) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 18000);
        try {
          const response = await fetch(PATH.api + url, {
            credentials: "same-origin",
            ...options,
            headers: { "Content-Type": "application/json", ...options.headers },
            signal: controller.signal,
          });
          const data = await response
            .json()
            .catch(() => ({ message: "Respons server tidak valid." }));
          if (!response.ok) {
            const err = new Error(data.message || "Permintaan gagal.");
            err.status = response.status;
            throw err;
          }
          return data;
        } catch (err) {
          if (err.name === "AbortError")
            throw new Error(
              "Koneksi lambat. Coba lagi; jawaban yang sama tidak dihitung dua kali.",
            );
          throw err;
        } finally {
          clearTimeout(timeout);
        }
      }
      function post(url, data, options = {}) {
        return api(url, {
          ...options,
          method: "POST",
          body: JSON.stringify(data),
        });
      }
      let lastFocus;
      function showModal(title, content, buttons) {
        lastFocus = document.activeElement;
        $("#modal-title").textContent = title;
        $("#modal-content").innerHTML = content;
        $("#modal-actions").replaceChildren(
          ...buttons.map(
            ({ label, action, primary = false, danger = false }) => {
              const b = document.createElement("button");
              b.type = "button";
              b.textContent = label;
              b.className = danger
                ? "min-h-11 rounded-2xl bg-rose-700 px-4 py-2 font-bold text-white"
                : primary
                  ? PRIMARY
                  : SECONDARY;
              b.addEventListener("click", action);
              return b;
            },
          ),
        );
        $("#modal").classList.remove("hidden");
        $("#modal").classList.add("flex");
        document.body.style.overflow = "hidden";
        (
          $("#modal-content").querySelector("input,textarea,button") ||
          $("#modal-actions button")
        ).focus();
      }
      function closeModal() {
        $("#modal").classList.add("hidden");
        $("#modal").classList.remove("flex");
        document.body.style.overflow = "";
        lastFocus?.focus();
      }
      function confirmAction(title, message, action) {
        showModal(title, `<p class="leading-relaxed">${esc(message)}</p>`, [
          { label: "Batal", action: closeModal },
          {
            label: "Hapus",
            danger: true,
            action: async () => {
              closeModal();
              await action();
            },
          },
        ]);
      }
      $("#modal").addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
        if (e.key === "Tab") {
          const focusable = [
            ...$("#modal").querySelectorAll(
              'button:not(:disabled),input,textarea,a[href],[tabindex="0"]',
            ),
          ].filter((el) => el.getClientRects().length);
          const first = focusable[0],
            last = focusable.at(-1);
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      });
      const STORE_KEY = "bunpou.progress.v1";
      function readProgress() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (!raw) return { version: 1, sessions: [] };
          const data = JSON.parse(raw);
          if (
            data.version !== 1 ||
            !Array.isArray(data.sessions) ||
            data.sessions.some(
              (s) =>
                !s ||
                typeof s.id !== "string" ||
                typeof s.deckId !== "string" ||
                !Array.isArray(s.results) ||
                !Number.isFinite(s.totalXp) ||
                !Number.isFinite(s.total) ||
                s.total < 1 ||
                !Number.isFinite(s.correct) ||
                !Number.isFinite(s.totalSeconds) ||
                !Number.isFinite(s.mismatches) ||
                s.results.some(
                  (r) =>
                    !r ||
                    !Array.isArray(r.positions) ||
                    !Array.isArray(r.actual) ||
                    !Array.isArray(r.expected),
                ),
            )
          )
            throw new Error();
          return data;
        } catch (err) {
          toast("Progres browser tidak dapat dibaca. Data lama tidak ditimpa.");
          return null;
        }
      }
      function saveSummary(s) {
        const progress = readProgress();
        if (!progress) return false;
        if (progress.sessions.some((old) => old.id === s.id)) return true;
        try {
          progress.sessions.push(s);
          localStorage.setItem(STORE_KEY, JSON.stringify(progress));
          return true;
        } catch (err) {
          toast(
            "Penyimpanan browser penuh atau diblokir. Hasil belum tersimpan; kosongkan ruang lalu coba lagi.",
          );
          return false;
        }
      }
      function totals(sessions) {
        const total = sessions.reduce((n, s) => n + s.total, 0),
          correct = sessions.reduce((n, s) => n + s.correct, 0);
        return {
          xp: sessions.reduce((n, s) => n + s.totalXp, 0),
          total,
          correct,
          accuracy: total ? Math.round((correct / total) * 100) : 0,
          done: new Set(sessions.map((s) => s.deckId)).size,
        };
      }
      function metric(label, value, icon = "star", color = "sky") {
        return `<div class="rounded-2xl border border-sky-100 bg-white p-4"><span class="text-sm font-bold text-slate-500"><i class="fa-solid fa-${icon} mr-1 text-${color}-600" aria-hidden="true"></i> ${esc(label)}</span><p class="mt-1 text-2xl font-black text-slate-800">${esc(value)}</p></div>`;
      }
      function resultDetail(r, index) {
        const status = r.timedOut
          ? "Waktu habis"
          : r.correct
            ? "Benar"
            : "Belum tepat";
        return `<details class="rounded-2xl border ${r.correct ? "border-emerald-200" : "border-rose-200"} bg-white p-4"><summary class="flex min-h-11 flex-wrap items-center justify-between gap-2 font-bold"><span>Soal ${index + 1} <span class="ml-2 ${r.correct ? "text-emerald-800" : "text-rose-800"}">${status}</span></span><span class="text-sm text-slate-500">${esc(r.timeSeconds)} dtk · +${esc(r.xp)} EXP <i class="fa-solid fa-chevron-down ml-2" aria-hidden="true"></i></span></summary><div class="mt-3 space-y-3 border-t border-slate-100 pt-4"><div><p class="text-sm font-bold text-slate-500">Jawabanmu</p><p class="jp mt-1 leading-loose">${esc(r.actual.join(" / ") || "Belum ada potongan")}</p></div><div class="rounded-xl bg-emerald-50 p-3"><p class="text-sm font-bold text-emerald-800">Susunan benar</p><p class="jp mt-1 leading-loose text-slate-800">${esc(r.expected.join(""))}</p></div>${r.clue ? `<p class="text-sm text-slate-500">Clue: ${esc(r.clue)}</p>` : ""}<p class="text-sm font-bold">${esc(r.mismatches)} potongan salah posisi / belum terisi</p><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="border-b border-slate-100 text-slate-500"><th class="p-2">Posisi</th><th class="p-2">Jawabanmu</th><th class="p-2">Seharusnya</th></tr></thead><tbody>${r.positions.map((p) => `<tr class="${p.match ? "bg-emerald-50/50" : "bg-rose-50"}"><td class="p-2">${esc(p.position)} <span aria-label="${p.match ? "tepat" : "salah"}">${p.match ? "✓" : "×"}</span></td><td class="jp p-2">${esc(p.actual ?? "—")}</td><td class="jp p-2">${esc(p.expected)}</td></tr>`).join("")}</tbody></table></div></div></details>`;
      }
      function summaryHTML(s) {
        return `<div class="grid grid-cols-2 gap-3 sm:grid-cols-4">${metric("Akurasi", s.accuracy + "%", "bullseye")}${metric("EXP", "+" + s.totalXp, "star")}${metric("Benar", s.correct + "/" + s.total, "check", "emerald")}${metric("Salah", s.incorrect, "xmark", "rose")}</div><div class="mt-4 flex flex-wrap gap-x-5 gap-y-2 rounded-2xl bg-white p-4 text-sm"><span>Waktu habis: <b>${esc(s.timedOut)}</b></span><span>Salah posisi: <b>${esc(s.mismatches)}</b></span><span>Total waktu menjawab: <b>${esc(s.totalSeconds)} dtk</b></span><span>Rata-rata: <b>${(s.totalSeconds / Math.max(1, s.total)).toFixed(1)} dtk/soal</b></span><span>Rangkaian benar terpanjang: <b>${esc(s.bestStreak)}</b></span></div><h3 class="mb-3 mt-6 text-lg font-extrabold">Lihat kembali jawabanmu</h3><div class="space-y-3">${s.results.map(resultDetail).join("")}</div>`;
      }

      const progress = readProgress();
      const stats = totals(progress?.sessions || []);
      $("#overview").innerHTML =
        metric("Total EXP", stats.xp, "star") +
        metric("Deck selesai", stats.done, "circle-check") +
        metric("Akurasi", stats.accuracy + "%", "bullseye");
      async function loadDecks() {
        try {
          const { decks } = await api("/decks");
          $("#deck-count").textContent = decks.length + " deck";
          if (!decks.length) {
            $("#decks").innerHTML =
              `<div class="rounded-3xl border border-dashed border-sky-300 bg-white p-8 text-center sm:col-span-2"><i class="fa-solid fa-seedling text-3xl text-sky-600" aria-hidden="true"></i><h3 class="mt-3 font-extrabold">Deck pertama sedang menunggu</h3><p class="mt-2 text-slate-500">Admin bisa membuat deck dan menambahkan soal.</p><a href="${PATH.admin}" class="${SECONDARY} mt-5">Buka admin</a></div>`;
            return;
          }
          $("#decks").innerHTML = decks
            .map((d, i) => {
              const done = progress?.sessions.some(
                (s) => s.deckId === d.id && s.revision === d.revision,
              );
              const previous = progress?.sessions.some(
                (s) => s.deckId === d.id,
              );
              return `<article class="flex flex-col rounded-3xl border border-sky-100 bg-white p-5 shadow-sm"><div class="flex items-center justify-between"><span class="grid h-12 w-12 place-items-center rounded-2xl ${i % 2 ? "bg-indigo-100 text-indigo-700" : "bg-sky-100 text-sky-700"}"><i class="fa-solid fa-${i % 2 ? "book-open" : "puzzle-piece"} text-xl" aria-hidden="true"></i></span>${done ? '<span class="rounded-full bg-emerald-50 px-3 py-1 text-sm font-bold text-emerald-800">✓ Selesai</span>' : previous ? '<span class="rounded-full bg-amber-50 px-3 py-1 text-sm font-bold text-amber-800">Deck diperbarui</span>' : ""}</div><h3 class="mt-4 break-words text-xl font-extrabold text-slate-800">${esc(d.title)}</h3><p class="mt-1 break-words text-slate-500">${esc(d.description || "Latihan menyusun kalimat bahasa Jepang.")}</p><div class="mb-4 mt-4 flex flex-wrap gap-4 text-sm font-bold text-slate-500"><span><i class="fa-regular fa-clone mr-1" aria-hidden="true"></i> ${d.question_count} soal</span><span><i class="fa-regular fa-clock mr-1" aria-hidden="true"></i> ${d.seconds_per_question} dtk/soal</span></div><div class="mt-auto flex items-center justify-between gap-3 border-t border-sky-50 pt-4"><span class="min-w-0 truncate text-sm text-slate-500">Oleh ${esc(d.author)}</span>${d.question_count ? `<a class="${PRIMARY}" href="${PATH.game}?deck=${encodeURIComponent(d.id)}">${done ? "Main lagi" : "Main"} <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>` : '<span class="text-sm font-bold text-slate-400">Belum ada soal</span>'}</div></article>`;
            })
            .join("");
        } catch (err) {
          $("#decks").innerHTML =
            `<div class="rounded-2xl bg-white p-5 sm:col-span-2"><p>${esc(err.message)}</p><button id="reload" class="${SECONDARY} mt-4">Coba lagi</button></div>`;
          $("#reload").onclick = loadDecks;
        }
      }
      loadDecks();

      // Opsional: akses baca terstruktur pada browser yang mendukung WebMCP.
      function registerReadTool(name, description, read) {
        const context = document.modelContext;
        if (!context?.registerTool) return;
        const lifecycle = new AbortController();
        window.addEventListener("pagehide", () => lifecycle.abort(), {
          once: true,
        });
        try {
          Promise.resolve(
            context.registerTool(
              {
                name,
                description,
                inputSchema: {
                  type: "object",
                  properties: {},
                  additionalProperties: false,
                },
                annotations: { readOnlyHint: true, untrustedContentHint: true },
                execute(input) {
                  if (
                    !input ||
                    typeof input !== "object" ||
                    Array.isArray(input) ||
                    Object.keys(input).length
                  )
                    throw new Error("Input harus berupa objek kosong.");
                  return read();
                },
              },
              { signal: lifecycle.signal },
            ),
          ).catch(() => {});
        } catch {
          /* Browser biasa tetap memakai antarmuka utama. */
        }
      }
      registerReadTool(
        "list_bunpou_decks",
        "Baca daftar deck publik yang dapat dimainkan, tanpa kunci jawaban.",
        () => api("/decks"),
      );
    </script>
  </body>
</html>
